// This project was created using `reflex create`.
// To apply modifications, regenerate with `reflex generate --path "path/to/project.cfg"`.

@Variables: { REFLEX_PATH: "$[get_reflex_path:]"; };		// Automatically locate the SDK; override with reflex set REFLEX_PATH "/custom/path/reflex"

include: "$(REFLEX_PATH)/project_configs/cpp_app.cfg";

name: "csv_viewer";

@Target App:
{
	inherit: cpp_app;

	@Variables:
	{
		VENDOR_NAME: "csv_viewer";
		PRODUCT_NAME: "csv_viewer";
		PRODUCT_VERSION: "1.0.0";
		PRODUCT_PACKAGE_IDENTIFIER: "com.csv-viewer.csv-viewer";
	};

	@Files sources:
	{
		'': "$(REFLEX_PATH)/src/reflex_ext.cpp";
		code: 
		"code/resources.cpp", 
		"code/entry.cpp", 
		"code/app.cpp", 
		"code/view.cpp";
	};

	@Files headers:
	{
		code: "code/**/*.h";
	};

	@Files other:
	{
		'': "resources.xml";
		resources: "resources/**/*";
	};
};
